<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Station Command</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/RCFRLogo-removebg-preview.png') }}">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #050505; color: #f3f4f6; font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center px-6">
    <main class="w-full max-w-md bg-neutral-950 border border-neutral-800 rounded-2xl p-8 shadow-2xl">
        <div class="flex items-center gap-4 mb-8">
            <div class="w-14 h-14 rounded-xl bg-red-950/70 border border-red-900/50 flex items-center justify-center">
                <img src="{{ url_for('static', filename='images/RCFRLogo-removebg-preview.png') }}" alt="Station Command logo" class="w-full h-full object-contain">
            </div>
            <div>
                <p class="text-xs uppercase tracking-[0.25em] text-red-500 font-semibold">Station Command</p>
                <h1 class="text-2xl font-bold text-white">Sign in to continue</h1>
            </div>
        </div>
        <p class="text-sm text-neutral-400 mb-6">A Roblox account is required to access incident records and response tools.</p>
        <a href="{{ url_for('roblox_login') }}" class="w-full inline-flex items-center justify-center gap-2 bg-red-600 hover:bg-red-700 text-white px-4 py-3 rounded-xl text-sm font-semibold transition">Continue with Roblox</a>
    </main>
</body>
</html>
